<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>netbug</title>
<meta name="netbug-token" content="__NETBUG_TOKEN__">
<!-- Served by netbug.exe on port 8787. No external requests, so it keeps working while the
     internet is down: Apple devices use their own SF Pro, everything else gets Inter from
     /fonts/inter.woff2. Polls /api/state every 1 s and /api/events every 2 s, only while visible.
     On the laptop itself netbug fills in the token above, which shows the Router protection panel
     (polls /api/fix every 2 s and sends its actions with the token); everyone else sees no controls. -->
<style>
@font-face {
  font-family: "Inter";
  src: url("/fonts/inter.woff2") format("woff2");
  font-weight: 400 700;
  font-display: swap;
}
:root {
  --bg: #000;
  --line: #222;
  --panel-line: #2a2a2a;
  --ink: #fff;
  --ok: #30d158;
  --lag: #ff9f0a;
  --down: #ff453a;
  --gw: #0a84ff;
  --net: #fff;
  --udp: #bf5af2;
  --info: #64d2ff;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body {
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  font-feature-settings: "tnum";
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px max(24px, env(safe-area-inset-right)) 48px max(24px, env(safe-area-inset-left));
}

header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }
.brand { font: 700 18px/1 var(--display); letter-spacing: -0.02em; }
.meta { font-size: 13px; display: flex; gap: 4px 18px; flex-wrap: wrap; }
.meta b, .axis b { font-weight: 600; }

.status { margin: 48px 0 32px; display: grid; grid-template-columns: auto 1fr; column-gap: 18px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); grid-row: span 2; margin-top: 0.42em; font-size: clamp(30px, 6vw, 56px); }
.headline { font: 700 clamp(30px, 6vw, 56px)/1.05 var(--display); letter-spacing: -0.035em; margin: 0; }
.sub { margin: 10px 0 0; font-size: 17px; line-height: 1.45; max-width: 60ch; }
body[data-state="lag"] .dot { background: var(--lag); }
body[data-state="lag"] .headline { color: var(--lag); }
body[data-state="down"] .headline, body[data-state="stale"] .headline { color: var(--down); }
.fact dd.alert { color: var(--down); }
body[data-state="down"] .dot, body[data-state="stale"] .dot { background: var(--down); }
body[data-state="lag"] .dot, body[data-state="down"] .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.trace { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
canvas { display: block; width: 100%; height: 200px; }
.axis { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding-top: 8px; }

.readouts { display: grid; grid-template-columns: repeat(6, 1fr); margin: 30px 0 0; }
.readout { padding-right: 16px; min-width: 0; }
.readout + .readout { border-left: 1px solid var(--line); padding-left: 16px; }
.readout .k { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.readout .k i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.readout .v { font: 600 30px/1.15 var(--display); letter-spacing: -0.03em; margin-top: 2px; }
.readout .v small { font: 500 14px var(--sans); letter-spacing: 0; margin-left: 3px; }
.readout .v.bad { color: var(--down); }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 32px; margin: 32px 0 48px; }
.fact { border-top: 1px solid var(--line); padding: 12px 0 14px; min-width: 0; }
.fact dt { font-size: 13px; font-weight: 600; }
.fact dd { margin: 3px 0 0; font-size: 16px; font-weight: 400; overflow-wrap: anywhere; }
.fact dd span { display: block; font-size: 13px; font-weight: 400; margin-top: 2px; }

.logs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.logs-head h2 { font: 700 20px/1 var(--display); letter-spacing: -0.02em; margin: 0; }
.logs-head label { font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--gw); width: 16px; height: 16px; margin: 0; }
.log-wrap { position: relative; }
#log {
  border: 1px solid var(--panel-line);
  border-radius: 16px;
  height: 50vh; min-height: 300px;
  overflow-y: auto;
  padding: 12px 0;
  font: 12.5px/1.7 var(--mono);
  overscroll-behavior: contain;
}
#log .l { display: grid; grid-template-columns: 70px 1fr; gap: 14px; padding: 0 18px; }
#log .m { white-space: pre-wrap; overflow-wrap: anywhere; }
#log .day { padding: 12px 18px 4px; font: 600 12px var(--sans); }
#log .day:first-child { padding-top: 2px; }
#log .down .m { color: var(--down); }
#log .lag .m { color: var(--lag); }
#log .t { font-weight: 700; }
#log .quiet .t, #log .quiet .m { color: var(--info); }
#log.hide-quiet .quiet { display: none; }
#jump {
  position: absolute; right: 14px; bottom: 14px;
  background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
  font: 600 13px/1 var(--sans); padding: 10px 16px; cursor: pointer; display: none;
}
#jump.show { display: block; }
button:focus-visible, input:focus-visible, #log:focus-visible { outline: 2px solid var(--gw); outline-offset: 2px; }

.fix { border: 1px solid var(--panel-line); border-radius: 18px; padding: 20px 22px 18px; margin: 0 0 36px; }
.fix[hidden] { display: none; }
.fix-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.fix h2 { font: 700 20px/1.2 var(--display); letter-spacing: -0.02em; margin: 0; }
.fix-state { font-size: 14px; font-weight: 600; }
.fix-state.ok { color: var(--ok); }
.fix-state.warn { color: var(--lag); }
.fix-state.bad { color: var(--down); }
.fix-sub { margin: 8px 0 16px; font-size: 15px; max-width: 70ch; }
.sw { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.sw input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 13px; background: #39393d; position: relative; cursor: pointer; margin: 2px 0 0; transition: background .2s; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw input:checked { background: var(--ok); }
.sw input:checked::after { transform: translateX(18px); }
.sw input:disabled { opacity: .4; cursor: not-allowed; }
.sw b { font-size: 16px; font-weight: 600; display: block; }
.sw small { font-size: 13px; display: block; margin-top: 2px; }
.cands { margin: 6px 0 0; padding: 0; list-style: none; }
.cands li { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 190px 1fr; gap: 2px 16px; }
.cands .mac { font: 600 15px var(--mono); }
.cands .mac.ok { color: var(--ok); }
.cands .mac.bad { color: var(--down); }
.cands .why { font-size: 14px; }
.cands .src { font-size: 12.5px; grid-column: 2; }
.fix-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; font: 600 14px/1 var(--sans); padding: 11px 18px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #444; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.fix-err { color: var(--down); font-size: 14px; margin-top: 10px; }

@media (max-width: 600px) {
  .facts { grid-template-columns: repeat(2, 1fr); column-gap: 16px; }
  .cands li { grid-template-columns: 1fr; }
  .cands .src { grid-column: 1; }
  .fact.wide { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  main { padding: 20px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  .status { margin: 32px 0 24px; column-gap: 14px; }
  .dot { width: 12px; height: 12px; }
  .sub { font-size: 16px; }
  .readouts { grid-template-columns: repeat(3, 1fr); row-gap: 20px; margin-top: 24px; }
  .readout:nth-child(4) { border-left: 0; padding-left: 0; }
  .readout .v { font-size: 26px; }
  canvas { height: 170px; }
  .axis .mid { display: none; }
  .facts { margin: 24px 0 36px; }
  .fact dd { font-size: 15px; }
  #log { height: 60vh; }
  #log .l { grid-template-columns: 1fr; gap: 0; padding: 4px 14px; }
  #log .t { font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
</style>
</head>
<body data-state="ok">
<main>
  <header>
    <div class="brand">netbug</div>
    <div class="meta"><span id="m-up">Connecting…</span><span id="m-mem"></span><span id="m-host"></span></div>
  </header>

  <section class="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <h1 class="headline" id="headline">Connecting to netbug</h1>
    <p class="sub" id="sub">Waiting for the first reading.</p>
  </section>

  <section class="fix" id="fix" hidden aria-live="polite">
    <div class="fix-head"><h2>Router protection:</h2><span class="fix-state" id="fx-state"></span></div>
    <p class="fix-sub" id="fx-sub"></p>
    <label class="sw"><input type="checkbox" id="fx-auto"><span><b>Auto-detect the real router</b><small>Checks now, every 30 minutes, when the router changes and when spoofing is seen. Each check cuts the connection for a few seconds. It never changes a pin by itself.</small></span></label>
    <label class="sw"><input type="checkbox" id="fx-pin" disabled><span><b>Pin it permanently</b><small id="fx-pin-note">Windows then ignores fake “I am the router” replies, even after a restart. It only protects this laptop.</small></span></label>
    <ul class="cands" id="fx-cands"></ul>
    <div class="fix-actions"><button class="btn" id="fx-check" type="button">Check now</button><button class="btn ghost" id="fx-stop" type="button" hidden>Stop netbug</button></div>
    <div class="fix-err" id="fx-err"></div>
  </section>

  <div class="trace">
    <canvas id="chart" aria-label="Gateway, Cloudflare and UDP round-trip times over the last 5 minutes"></canvas>
  </div>
  <div class="axis"><span>5 min ago</span><span class="mid"><b>Red:</b> outage. <b>Orange:</b> local lag</span><span>Now</span></div>

  <div class="readouts">
    <div class="readout"><div class="k"><i style="background:var(--gw)"></i>Gateway:</div><div class="v" id="r-gw">–</div></div>
    <div class="readout"><div class="k"><i style="background:var(--net)"></i>Cloudflare:</div><div class="v" id="r-cf">–</div></div>
    <div class="readout"><div class="k">Google:</div><div class="v" id="r-g">–</div></div>
    <div class="readout"><div class="k"><i style="background:var(--udp)"></i>UDP:</div><div class="v" id="r-udp">–</div></div>
    <div class="readout"><div class="k">DNS:</div><div class="v" id="r-dns">–</div></div>
    <div class="readout"><div class="k">New TCP:</div><div class="v" id="r-tcp">–</div></div>
  </div>

  <dl class="facts" id="facts"></dl>

  <div class="logs-head">
    <h2>Events</h2>
    <label><input type="checkbox" id="quiet" checked> Show health lines</label>
  </div>
  <div class="log-wrap">
    <div id="log" tabindex="0" aria-label="events.log"></div>
    <button id="jump" type="button">Jump to latest</button>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const C = {};                    // palette read once, not on every chart draw
  for (const n of ['line', 'ink', 'gw', 'net', 'udp', 'sans', 'lag', 'down']) C[n] = css.getPropertyValue('--' + n).trim();
  // DOM writes only when the content changed, so an unchanged second costs no layout
  const put = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
  const putText = (el, text) => { if (el.textContent !== text) el.textContent = text; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let since = 0, offset = -1, lastOk = 0, state = null;
  const hist = new Map();          // unix s -> [t, gw, cf, g, udp, dns, tcp, fail]
  let lastProblem = null;          // latest finished outage/lag from events.log

  // ---------- formatting ----------
  const ms = v => v < 0 ? null : v;
  const dur = s => {
    s = Math.max(0, Math.round(s));
    if (s < 60) return s + ' s';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' min' + (s % 60 && m < 10 ? ' ' + (s % 60) + ' s' : '');
    const h = Math.floor(m / 60);
    if (h < 48) return h + ' h ' + (m % 60) + ' min';
    return Math.floor(h / 24) + ' days';
  };
  const ago = at => {
    const s = (Date.now() - at) / 1000;
    return s < 86400 * 2 ? dur(s) + ' ago' : 'on ' + new Date(at).toLocaleDateString();
  };
  const failNames = { no_iface: 'no network adapter', gw: 'gateway ping', internet: 'internet ping', dns: 'DNS',
    udp: 'UDP', tcp: 'new TCP connections', udp_high: 'UDP port usage', lag: 'local lag' };
  const failText = f => f.split('|').filter(Boolean).map(x => failNames[x] || x).join(', ');

  function setReadout(id, v) {
    const el = $(id), lost = v === null || v === undefined;
    const cls = lost ? 'v bad' : 'v';
    if (el.className !== cls) el.className = cls;
    put(el, lost ? 'lost' : v + '<small>ms</small>');
  }

  // ---------- status ----------
  function renderStatus() {
    const now = Date.now() / 1000;
    let st = 'ok', head, sub;
    const s = state && state.sample;
    if (!state || now - lastOk > 6) {
      st = 'stale';
      head = 'netbug isn’t answering';
      sub = lastOk ? 'No reply for ' + dur(now - lastOk) + '. Check that the netbug task is running on the laptop.'
                   : 'Trying to reach the logger at this address.';
    } else if (!s) {
      head = 'Starting up'; sub = 'The first reading arrives within a second.';
    } else if (s.outage) {
      st = 'down';
      head = 'Connection is down';
      sub = 'Failing: ' + failText(s.fail) + '. Ongoing for ' + dur(state.now - s.outage) + '.' + (s.gwAlert ? ' Possible ARP spoofing: ' + s.gwAlert + '.' : '');
    } else if (s.gwAlert) {
      st = 'down';
      head = 'Possible ARP spoofing';
      sub = s.gwAlert + '. Shown for 30 minutes. See the events below.';
    } else if (s.lag) {
      st = 'lag';
      head = 'Local network is lagging';
      sub = 'Gateway ping is high or dropping. Ongoing for ' + dur(state.now - s.lag) + '.';
    } else {
      head = 'Network is healthy';
      sub = s.fail ? 'One-off miss this second: ' + failText(s.fail) + '.'
          : lastProblem ? 'Last problem: ' + lastProblem.what + ', ' + ago(lastProblem.at) + '.'
          : 'No outages or lag in the recent log.';
    }
    if (document.body.dataset.state !== st) document.body.dataset.state = st;
    putText($('headline'), head);
    putText($('sub'), sub);
    const title = (st === 'ok' ? '' : st === 'lag' ? '◐ ' : '● ') + 'netbug';
    if (document.title !== title) document.title = title;
  }

  function renderState() {
    const s = state.sample;
    put($('m-up'), '<b>Uptime:</b> ' + dur(state.now - state.started));
    put($('m-mem'), '<b>Memory:</b> ' + state.memMb.toFixed(0) + ' MB');
    put($('m-host'), '<b>Address:</b> ' + esc(location.host));
    if (!s) return;
    const last = [...hist.values()].pop();
    if (last) {
      setReadout('r-gw', ms(last[1])); setReadout('r-cf', ms(last[2])); setReadout('r-g', ms(last[3]));
      setReadout('r-udp', ms(last[4])); setReadout('r-dns', ms(last[5])); setReadout('r-tcp', ms(last[6]));
    }
    // "cf=1.2.3.4:5678" -> address + which STUN server saw it
    const nat = s.udpMap ? esc(s.udpMap.replace(/^\w+=/, '')) + '<span>seen by ' + (s.udpMap.startsWith('cf=') ? 'Cloudflare' : 'Google') + ' STUN</span>' : '–';
    // "svchost=14 NVIDIA Overlay=8" -> "svchost 14, NVIDIA Overlay 8" (names can contain spaces)
    const top = [...(s.udpTop || '').matchAll(/(\S.*?)=(\d+)/g)].map(m => m[1] + ' ' + m[2]).join(', ');
    const facts = [
      ['Interface', esc(s.iface || 'none')],
      ['USB Ethernet link', esc(s.link)],
      ['Local IP', esc(s.ip || '–')],
      ['Gateway', esc(s.gw || '–')],
      ['Gateway MAC', esc(s.gwMac || '–') + '<span>' +
        (s.gwArp === 'static' ? 'Pinned (static ARP entry)' : s.gwArp === 'dynamic' ? 'Learned (dynamic ARP entry, can be spoofed)' : 'ARP entry: ' + esc(s.gwArp || 'unknown')) +
        (s.arpWatch ? '. ARP watch: ' + esc(s.arpWatch) : '') + '</span>', !!s.gwAlert],
      ['Public IP', esc(s.pubIp || '–')],
      ['UDP NAT mapping', nat],
      ['Packets in the last second', esc(s.tx + ' sent, ' + s.rx + ' received')],
      ['UDP ports in use', s.udpTotal < 0 ? '–' : s.udpTotal + (top ? '<span>' + esc(top) + '</span>' : '')],
    ];
    // the last one (UDP ports + per-process list) is the longest: full width on phones
    put($('facts'), facts.map(([k, v, alert], i) =>
      '<div class="fact' + (i === facts.length - 1 ? ' wide' : '') + '"><dt>' + k + ':</dt><dd' + (alert ? ' class="alert"' : '') + '>' + v + '</dd></div>').join(''));
  }

  // ---------- chart ----------
  const chart = $('chart'), ctx = chart.getContext('2d');
  const SPAN = 300, MAXMS = 300;
  const y = (v, h) => { const r = Math.sqrt(Math.min(v, MAXMS) / MAXMS); return h - 8 - r * (h - 20); };

  function draw() {
    const dpr = window.devicePixelRatio || 1, w = chart.clientWidth, h = chart.clientHeight;
    if (chart.width !== w * dpr || chart.height !== h * dpr) { chart.width = w * dpr; chart.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const end = state ? state.now : Date.now() / 1000;
    const pw = w - 52;               // plot width; the right gutter holds the scale labels
    const x = t => (1 - (end - t) / SPAN) * pw;

    ctx.font = '500 11px ' + C.sans;
    ctx.textAlign = 'right';
    for (const g of [1, 10, 50, 150, 300]) {
      const yy = Math.round(y(g, h)) + .5;
      ctx.strokeStyle = C.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(pw, yy); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.fillText(g + (g === 300 ? '+ ms' : ' ms'), w - 2, yy + 4);
    }

    const rows = [...hist.values()];
    const bw = Math.max(1, pw / SPAN);
    // a failed second shades back to the previous sample: during an outage probes time out
    // and samples arrive every 2-3 s, so fixed-width bands would leave stripes
    let prevT = null;
    for (const r of rows) {
      if (r[7]) {
        const lagOnly = r[7].split('|').every(f => f === 'lag' || f === 'gw' || f === 'udp_high');
        const x0 = prevT !== null && r[0] - prevT <= 10 ? x(prevT) : x(r[0]) - bw;
        const a = Math.round(x0), b = Math.round(x(r[0]));   // whole pixels: no overlap seams
        ctx.fillStyle = lagOnly ? 'rgba(255,159,10,.32)' : 'rgba(255,69,58,.45)';
        ctx.fillRect(a, 0, Math.max(1, b - a), h);
        ctx.fillStyle = lagOnly ? C.lag : C.down;               // solid strip on top: visible at a glance
        ctx.fillRect(a, 0, Math.max(1, b - a), 4);
      }
      prevT = r[0];
    }

    const line = (i, color, width) => {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round';
      ctx.beginPath();
      let pen = false, prev = 0;
      for (const r of rows) {
        const v = r[i];
        if (v < 0 || r[0] - prev > 2) pen = false;
        prev = r[0];
        if (v < 0) continue;
        const px = x(r[0]), py = y(v, h);
        pen ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        pen = true;
      }
      ctx.stroke();
    };
    line(4, C.udp, 1.25);
    line(2, C.net, 1.25);
    line(1, C.gw, 2);
  }

  // ---------- events ----------
  const log = $('log');
  let follow = true, lastDay = '';
  const kind = m =>
    /^(OUTAGE|\s*outage now|GATEWAY MAC CHANGED|ARP SPOOFING|\s*gateway is pinned)/.test(m) ? 'down' :
    /^LAG/.test(m) ? 'lag' :
    /^health:/.test(m) ? 'quiet' : '';

  function addLines(lines) {
    const frag = document.createDocumentFragment();
    for (const raw of lines) {
      const day = raw.slice(0, 10), time = raw.slice(11, 19), msg = raw.slice(21);
      if (day !== lastDay) {
        lastDay = day;
        const d = document.createElement('div');
        d.className = 'day';
        d.textContent = new Date(day + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
        frag.appendChild(d);
      }
      const k = kind(msg);
      const el = document.createElement('div');
      el.className = 'l' + (k ? ' ' + k : '');
      el.innerHTML = '<span class="t">' + esc(time) + '</span><span class="m">' + esc(msg) + '</span>';
      frag.appendChild(el);

      // a LAG summary logged within 2 min of an outage ending is the same incident: keep the outage
      let m;
      const at = new Date(day + 'T' + time).getTime();
      if ((m = msg.match(/^OUTAGE END after ([\d,]+) s/))) lastProblem = { what: 'outage lasting ' + dur(+m[1].replace(/,/g, '')), at, outage: true };
      else if ((m = msg.match(/^LAG .*?\(([\d,]+) s\)/)) && !(lastProblem && lastProblem.outage && at - lastProblem.at < 120000))
        lastProblem = { what: 'lag lasting ' + dur(+m[1].replace(/,/g, '')), at };
    }
    log.appendChild(frag);
    while (log.childElementCount > 4000) log.firstElementChild.remove();
    if (follow) log.scrollTop = log.scrollHeight;
  }

  log.addEventListener('scroll', () => {
    follow = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
    $('jump').classList.toggle('show', !follow);
  });
  $('jump').onclick = () => { log.scrollTop = log.scrollHeight; };
  // the web font swapping in changes line heights after the first auto-scroll: re-pin to the bottom
  if (document.fonts) document.fonts.ready.then(() => { if (follow) log.scrollTop = log.scrollHeight; });
  $('quiet').onchange = e => {
    log.classList.toggle('hide-quiet', !e.target.checked);
    if (follow) log.scrollTop = log.scrollHeight;
  };

  // ---------- polling ----------
  async function pollState() {
    try {
      const r = await fetch('/api/state?since=' + since, { cache: 'no-store' });
      state = await r.json();
      lastOk = Date.now() / 1000;
      for (const h of state.hist) { hist.set(h[0], h); since = Math.max(since, h[0]); }
      for (const t of hist.keys()) if (t < state.now - SPAN) hist.delete(t); else break;
      renderState();
    } catch (e) { /* shown as "isn't answering" by renderStatus */ }
    renderStatus();
    draw();
  }
  async function pollEvents() {
    try {
      const r = await fetch('/api/events' + (offset >= 0 ? '?from=' + offset : ''), { cache: 'no-store' });
      const j = await r.json();
      if (j.reset && offset >= 0) { log.textContent = ''; lastDay = ''; }
      offset = j.next;
      if (j.lines.length) { addLines(j.lines); renderStatus(); }
    } catch (e) { }
  }

  // ---------- router protection (only on the laptop itself) ----------
  const token = document.querySelector('meta[name="netbug-token"]').content;
  const fixOn = /^[0-9a-f]{32}$/.test(token);
  let fix = null, stopArmed = false;
  async function fixCall(path, method) {
    try {
      const r = await fetch('/api/fix' + path, { method: method || 'GET', cache: 'no-store', headers: { 'X-Netbug-Token': token } });
      if (r.ok) { fix = await r.json(); renderFix(); }
    } catch (e) { }
  }
  function renderFix() {
    const f = fix, res = f.result;
    $('fix').hidden = false;
    let st = '', cls = '', sub;
    if (!f.gw) { st = 'No network'; cls = 'warn'; sub = 'Connect to the network first.'; }
    else if (f.busy) { st = 'Checking…'; cls = 'warn'; sub = (f.step || 'Working') + '. The connection drops for a few seconds while each address is tested.'; }
    else if (f.pinned && f.verified && f.pinned !== f.verified) { st = 'Pin differs'; cls = 'bad'; sub = 'Router ' + f.gw + ' is pinned to ' + f.pinned + ', but the last check found ' + f.verified + '. If the router was replaced, turn the pin off and on again.'; }
    else if (f.pinned) { st = 'Protected'; cls = 'ok'; sub = 'Router ' + f.gw + ' is pinned to ' + f.pinned + ' on ' + f.iface + '. Fake router replies are ignored.'; }
    else if (f.verified) { st = 'Not pinned'; cls = 'warn'; sub = 'The real router ' + f.gw + ' is ' + f.verified + '. Turn on the pin to protect this laptop.'; }
    else { st = 'Not pinned'; cls = 'warn'; sub = 'Router ' + f.gw + ' on ' + f.iface + ' is currently ' + (f.arpMac || 'unknown') + ' (' + (f.arpType || 'not in the ARP table') + '). Run a check to find the real one.'; }
    putText($('fx-state'), st); $('fx-state').className = 'fix-state ' + cls;
    putText($('fx-sub'), sub);
    $('fx-auto').checked = f.auto;
    const pin = $('fx-pin');
    pin.checked = !!f.pinned;
    pin.disabled = f.busy || !f.gw || (!f.pinned && !f.verified);
    putText($('fx-pin-note'), (!f.pinned && !f.verified ? 'Run a check first. ' : '') + 'Windows then ignores fake “I am the router” replies, even after a restart. It only protects this laptop. Turn it off before plugging this adapter into another network that uses the same router address (' + (f.gw || '–') + ').');
    $('fx-check').disabled = f.busy || !f.gw;
    put($('fx-cands'), res && res.cands ? res.cands.map(c =>
      '<li><span class="mac ' + (c.mac === res.chosen ? 'ok' : c.works ? '' : 'bad') + '">' + esc(c.mac) + '</span><span class="why">' + esc(c.verdict) +
      (c.random ? '. Random-style address, unusual for a router' : '') + '.</span><span class="src">Seen as: ' + esc(c.from) + '</span></li>').join('') +
      (res.note ? '<li><span></span><span class="why">' + esc(res.note) + '</span></li>' : '') : '');
    $('fx-stop').hidden = !f.portable;
    putText($('fx-err'), f.error || '');
  }
  if (fixOn) {
    $('fx-check').onclick = () => fixCall('/check', 'POST');
    $('fx-auto').onchange = e => fixCall('/auto?on=' + (e.target.checked ? 1 : 0), 'POST');
    $('fx-pin').onchange = e => fixCall(e.target.checked ? '/pin' : '/unpin', 'POST');
    $('fx-stop').onclick = () => {
      if (!stopArmed) { stopArmed = true; putText($('fx-stop'), 'Click again to stop'); setTimeout(() => { stopArmed = false; putText($('fx-stop'), 'Stop netbug'); }, 4000); return; }
      fixCall('/stop', 'POST');
    };
  }

  let timers = [];
  function start() {
    stop();
    pollState(); pollEvents();
    timers = [setInterval(pollState, 1000), setInterval(pollEvents, 2000)];
    if (fixOn) { fixCall(''); timers.push(setInterval(() => fixCall(''), 2000)); }
  }
  function stop() { timers.forEach(clearInterval); timers = []; }
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); });
  start();
})();
</script>
</body>
</html>
